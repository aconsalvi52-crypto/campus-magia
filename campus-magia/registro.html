<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EAAM | Registro Mágico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Cinzel', 'serif'] }, colors: { dark: '#050505', surface: '#0a0a0c', primary: '#d4af37', primary_hover: '#b5952f' } } } }
    </script>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .ambient-glow { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(5, 5, 5, 0) 70%); top: -200px; right: -200px; z-index: 0; pointer-events: none; }
        .ambient-glow-2 { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(5, 5, 5, 0) 70%); bottom: -150px; left: -150px; z-index: 0; pointer-events: none; }
        .glass-panel { background: rgba(10, 10, 12, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.08); }
        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-group input { width: 100%; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 1.25rem 1rem 0.5rem 1rem; border-radius: 0.5rem; outline: none; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #d4af37; background: rgba(212, 175, 55, 0.03); box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }
        .input-group label { position: absolute; left: 1rem; top: 1rem; color: #6b7280; transition: all 0.2s ease; pointer-events: none; font-size: 1rem; }
        .input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { top: 0.35rem; font-size: 0.75rem; color: #d4af37; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #b5952f); color: #050505; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
    <div class="ambient-glow"></div><div class="ambient-glow-2"></div>
    <div class="glass-panel w-full max-w-md p-10 rounded-2xl z-10 relative">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-serif font-bold tracking-widest text-primary uppercase leading-snug">Iniciación</h1>
            <p class="text-xs text-gray-400 mt-2 tracking-[0.1em]">La Orden evalúa a cada nuevo prospecto</p>
        </div>

        <form id="registroForm">
            <div class="input-group">
                <input type="text" id="name" placeholder=" " required autocomplete="off">
                <label for="name">Nombre Mágico (Alias)</label>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required autocomplete="off">
                <label for="email">Correo Electrónico</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required autocomplete="off">
                <label for="password">Contraseña Secreta</label>
            </div>

            <button type="submit" class="btn-primary w-full font-bold py-3.5 rounded-lg flex justify-center items-center uppercase tracking-wider text-sm mt-6">
                <span id="btn-text">Solicitar Acceso a la Orden</span>
            </button>
            <div class="text-center mt-4">
                <a href="index.html" class="text-xs text-primary hover:text-white transition-colors">Volver a la entrada</a>
            </div>
        </form>
        
        <div id="error-msg" class="mt-4 text-red-400 text-sm text-center hidden transition-opacity duration-300"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnText = document.getElementById('btn-text');
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('error-msg');
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            btnText.innerText = "Canalizando Magia...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            errorMsg.classList.add('hidden');
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Forzar el rol a student y el status a pending
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    role: 'student',
                    status: 'pending',
                    modulos_activos: []
                });
                
                alert("Tu aura ha sido registrada. Espera a que el Gran Maestro te conceda el paso.");
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                console.error(error);
                errorMsg.innerText = error.message;
                errorMsg.classList.remove('hidden');
                btnText.innerText = "Solicitar Acceso a la Orden";
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>

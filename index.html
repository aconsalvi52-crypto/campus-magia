<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escuela Argentina de Artes Mágicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Cinzel', 'serif'] },
                    colors: { dark: '#050505', surface: '#0a0a0c', surface_hover: '#141418', primary: '#d4af37', primary_hover: '#b5952f' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .ambient-glow { position: absolute; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(5, 5, 5, 0) 70%); top: -200px; right: -200px; z-index: 0; pointer-events: none; }
        .ambient-glow-2 { position: absolute; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(5, 5, 5, 0) 70%); bottom: -150px; left: -150px; z-index: 0; pointer-events: none; }
        .glass-panel { background: rgba(10, 10, 12, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.08); }
        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-group input { width: 100%; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 1.25rem 1rem 0.5rem 1rem; border-radius: 0.5rem; outline: none; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #d4af37; background: rgba(212, 175, 55, 0.03); box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }
        .input-group label { position: absolute; left: 1rem; top: 1rem; color: #6b7280; transition: all 0.2s ease; pointer-events: none; font-size: 1rem; }
        .input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { top: 0.35rem; font-size: 0.75rem; color: #d4af37; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #b5952f); color: #050505; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(212, 175, 55, 0.4); }
        .logo-gold-filter { filter: sepia(100%) saturate(200%) brightness(95%) hue-rotate(5deg) contrast(120%) drop-shadow(0 0 15px rgba(212,175,55,0.2)); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
    <div class="ambient-glow"></div><div class="ambient-glow-2"></div>
    <div class="glass-panel w-full max-w-md p-10 rounded-2xl z-10 relative">
        <div class="text-center mb-8">
            <img src="logo.png" alt="EAAM Logo" class="w-28 h-28 mx-auto mb-5 logo-gold-filter object-contain" onerror="this.src='https://via.placeholder.com/150?text=Logo'">
            <h1 class="text-xl font-serif font-bold tracking-widest text-primary uppercase leading-snug">Escuela Argentina<br>de Artes Mágicas</h1>
            <p class="text-xs text-gray-400 mt-2 tracking-[0.2em] uppercase">Campus Virtual</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder=" " required autocomplete="off">
                <label for="email">Correo Electrónico</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required autocomplete="off">
                <label for="password">Contraseña Secreta</label>
            </div>

            <div class="flex items-center justify-between mb-8 text-sm">
                <a href="registro.html" class="text-gray-400 hover:text-white transition-colors">Crear una cuenta nueva</a>
                <a href="#" class="text-primary hover:text-white transition-colors">¿Olvidaste el acceso?</a>
            </div>

            <button type="submit" class="btn-primary w-full font-bold py-3.5 rounded-lg flex justify-center items-center uppercase tracking-wider text-sm">
                <span id="btn-text">Ingresar al Campus</span>
                <svg id="btn-loader" class="animate-spin h-5 w-5 ml-3 hidden text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </form>
        
        <div id="error-msg" class="mt-4 text-red-400 text-sm text-center hidden transition-opacity duration-300"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const btn = e.target.querySelector('button');
            const errorMsg = document.getElementById('error-msg');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btnText.innerText = "Autenticando...";
            btnLoader.classList.remove('hidden');
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            errorMsg.classList.add('hidden');

            try {
                // 1. Autenticar con Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                
                // 2. Traer el rol del usuario desde Firestore
                const docRef = doc(db, "users", userCredential.user.uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    window.location.href = userData.role === 'admin' ? 'dashboard-profe.html' : 'dashboard.html';
                } else {
                    throw new Error("Usuario sin registro de rol.");
                }
            } catch (error) {
                console.error(error);
                btnText.innerText = "Ingresar al Campus";
                btnLoader.classList.add('hidden');
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                errorMsg.innerText = "Magia rechazada: " + (error.code === 'auth/invalid-credential' ? "Credenciales inválidas." : error.message);
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
